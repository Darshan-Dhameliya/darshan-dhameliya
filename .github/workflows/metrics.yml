name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Personal Account — Darshan-Dhameliya
  # ─────────────────────────────────────────────────────────────
  metrics-personal:
    name: Personal Account Metrics
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── Card 1: Profile Details + Languages + Calendar ────────
      - name: Profile Details Card (Personal)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN_PERSONAL }}
          user: Darshan-Dhameliya

          filename: assets/metrics-personal-details.svg
          output_action: commit
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore(metrics): update personal profile details [skip ci]"

          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_padding: 10

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_stars: yes
          plugin_stars_limit: 4

          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all

      # ── Card 2: Habits & Coding Patterns ──────────────────────
      - name: Habits & Streak Card (Personal)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN_PERSONAL }}
          user: Darshan-Dhameliya

          filename: assets/metrics-personal-streak.svg
          output_action: commit
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore(metrics): update personal habits [skip ci]"

          base: ""
          config_timezone: Asia/Kolkata

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      # ── Card 3: Achievements & Trophies ───────────────────────
      - name: Achievements Card (Personal)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN_PERSONAL }}
          user: Darshan-Dhameliya

          filename: assets/metrics-personal-achievements.svg
          output_action: commit
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore(metrics): update personal achievements [skip ci]"

          base: ""
          config_timezone: Asia/Kolkata

          # GitHub achievement badges (Starstruck, Pull Shark, YOLO, etc.)
          plugin_achievements: yes
          plugin_achievements_threshold: B        # show B-rank and above
          plugin_achievements_secrets: yes        # include secret achievements
          plugin_achievements_display: detailed   # show rank + label
          plugin_achievements_limit: 0            # 0 = show all

          # Notable public contributions (open-source)
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: commit

  # ─────────────────────────────────────────────────────────────
  # Job 2: Work Account — darshan-edelta
  # Shows work account info (achievements, activity, languages)
  # on the personal profile README
  # ─────────────────────────────────────────────────────────────
  metrics-work:
    name: Work Account Metrics
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── Card 1: Profile Details + Languages + Calendar ────────
      - name: Profile Details Card (Work)
        uses: lowlighter/metrics@latest
        with:
          # PAT from darshan-edelta account (scopes: read:user, repo)
          token: ${{ secrets.METRICS_TOKEN_WORK }}
          user: darshan-edelta

          filename: assets/metrics-work-details.svg
          output_action: commit
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore(metrics): update work profile details [skip ci]"

          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_padding: 10

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_stars: yes
          plugin_stars_limit: 4

          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all

      # ── Card 2: Habits & Coding Patterns ──────────────────────
      - name: Habits & Streak Card (Work)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN_WORK }}
          user: darshan-edelta

          filename: assets/metrics-work-streak.svg
          output_action: commit
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore(metrics): update work habits [skip ci]"

          base: ""
          config_timezone: Asia/Kolkata

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      # ── Card 3: Achievements & Trophies (Work) ────────────────
      - name: Achievements Card (Work)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN_WORK }}
          user: darshan-edelta

          filename: assets/metrics-work-achievements.svg
          output_action: commit
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore(metrics): update work achievements [skip ci]"

          base: ""
          config_timezone: Asia/Kolkata

          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          plugin_achievements_limit: 0

          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: commit
