name: Generate GitHub Metrics

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  metrics-personal:
    name: Personal Account Metrics
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Profile Details Card (Personal)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Darshan-Dhameliya
          filename: assets/metrics-personal-details.svg
          output_action: commit
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore(metrics): update personal profile details [skip ci]"
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_padding: 10
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_stars: yes
          plugin_stars_limit: 4
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all

      - name: Habits & Streak Card (Personal)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Darshan-Dhameliya
          filename: assets/metrics-personal-streak.svg
          output_action: commit
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore(metrics): update personal habits [skip ci]"
          base: ""
          config_timezone: Asia/Kolkata
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      - name: Achievements Card (Personal)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Darshan-Dhameliya
          filename: assets/metrics-personal-achievements.svg
          output_action: commit
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore(metrics): update personal achievements [skip ci]"
          base: ""
          config_timezone: Asia/Kolkata
          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          plugin_achievements_limit: 0
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: commit

  metrics-work:
    name: Work Account Metrics
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Profile Details Card (Work)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN_WORK }}
          user: darshan-edelta
          filename: assets/metrics-work-details.svg
          output_action: commit
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore(metrics): update work profile details [skip ci]"
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_padding: 10
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_stars: yes
          plugin_stars_limit: 4
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all

      - name: Habits & Streak Card (Work)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN_WORK }}
          user: darshan-edelta
          filename: assets/metrics-work-streak.svg
          output_action: commit
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore(metrics): update work habits [skip ci]"
          base: ""
          config_timezone: Asia/Kolkata
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      - name: Achievements Card (Work)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN_WORK }}
          user: darshan-edelta
          filename: assets/metrics-work-achievements.svg
          output_action: commit
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore(metrics): update work achievements [skip ci]"
          base: ""
          config_timezone: Asia/Kolkata
          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          plugin_achievements_limit: 0
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: commit
